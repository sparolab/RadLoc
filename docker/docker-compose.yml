# RadLoc container.
#
#   docker compose -f docker/docker-compose.yml build
#   docker compose -f docker/docker-compose.yml run --rm validate
#   docker compose -f docker/docker-compose.yml run --rm radloc      # shell
#
# Datasets are mounted read-only. Override the host paths with RADLOC_MULRAN_HOST
# and RADLOC_RADAR_HOST if they live elsewhere.

x-radloc: &radloc
  build:
    context: ..
    dockerfile: docker/Dockerfile
  image: radloc:humble
  network_mode: host
  ipc: host
  environment:
    - DISPLAY=${DISPLAY:-}
    - QT_X11_NO_MITSHM=1
    - ROS_DOMAIN_ID=0
    - RADLOC_MULRAN=/data/referee/Mulran
  volumes:
    - /tmp/.X11-unix:/tmp/.X11-unix:rw
    # Sources are mounted so host edits need no image rebuild. Read-only:
    # build trees live under /opt/radloc, so a run leaves the host repo clean.
    - ../cpp:/radloc/cpp:ro
    - ../docker:/radloc/docker:ro
    - ../ros2_ws:/radloc/ros2_ws:ro
    # Datasets, read-only.
    - ${RADLOC_MULRAN_HOST:-/storage/Datasets/ReFeree}:/data/referee:ro
    - ${RADLOC_RADAR_HOST:-/nas2/Radar_Datasets}:/data/radar:ro
    # Sessions and their results: the one place a run may write.
    - ${RADLOC_SESSIONS_HOST:-/storage/Datasets/ReFeree/radloc_sessions}:/data/sessions
    # `docker compose run` starts a fresh container each time, so the workspace
    # build has to outlive it. Kept off the host to stay out of the repository.
    - radloc-ros-build:/opt/radloc/ros-build
    - radloc-ros-install:/opt/radloc/ros-install
  working_dir: /radloc

services:
  # Interactive shell. radloc-build-core / radloc-build / radloc-validate are
  # defined by the entrypoint.
  radloc:
    <<: *radloc
    container_name: radloc
    stdin_open: true
    tty: true
    command: bash

  # Rebuild the mounted C++ core, then run every check.
  validate:
    <<: *radloc
    container_name: radloc_validate
    command: bash -lc "radloc-build-core && radloc-validate"

  # Multi-session alignment over two prepared sessions. Runs as the invoking
  # user so results do not come back root-owned.
  ltslam:
    <<: *radloc
    container_name: radloc_ltslam
    # UID/GID are readonly in bash, so they are passed under their own names;
    # see docker/README.md.
    user: "${RADLOC_UID:-1000}:${RADLOC_GID:-1000}"
    command: >
      bash -lc "ros2 run ltslam ltslam_node /radloc/ros2_ws/src/ltslam/config/mulran_kaist.yaml"

  # Build the ROS 2 workspace (odometry + LT-SLAM), once it is populated.
  build:
    <<: *radloc
    container_name: radloc_build
    command: bash -lc "radloc-build-core && radloc-build"

volumes:
  radloc-ros-build:
  radloc-ros-install:
