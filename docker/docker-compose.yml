# RadLoc container.
#
#   docker compose -f docker/docker-compose.yml build
#   docker compose -f docker/docker-compose.yml run --rm validate
#   docker compose -f docker/docker-compose.yml run --rm radloc      # shell
#
# Datasets are mounted read-only. Override the host paths with RADLOC_MULRAN_HOST
# and RADLOC_RADAR_HOST if they live elsewhere.

x-radloc: &radloc
  build:
    context: ..
    dockerfile: docker/Dockerfile.ros2
  image: radloc:humble
  network_mode: host
  ipc: host
  environment:
    - DISPLAY=${DISPLAY:-}
    - QT_X11_NO_MITSHM=1
    - HOME=/tmp
    - ROS_HOME=/tmp/.ros
    - ROS_DOMAIN_ID=0
    - RADLOC_MULRAN=/data/referee/Mulran
  volumes:
    - /tmp/.X11-unix:/tmp/.X11-unix:rw
    # Sources are mounted so host edits need no image rebuild. Read-only:
    # build trees live under /opt/radloc, so a run leaves the host repo clean.
    - ../cpp:/radloc/cpp:ro
    - ../docker:/radloc/docker:ro
    - ../applications:/radloc/applications:ro
    # Datasets, read-only.
    - ${RADLOC_MULRAN_HOST:-/storage/Datasets/ReFeree}:/data/referee:ro
    - ${RADLOC_RADAR_HOST:-/nas2/Radar_Datasets}:/data/radar:ro
    # Sequences in the layout the reader needs: one row per azimuth, eleven
    # header bytes then the range bins.
    - ${RADLOC_DATASETS_HOST:-/storage/Datasets/ReFeree}:/data/datasets:ro
    - ${RADLOC_OUTPUT_HOST:-../output}:/data/output
    # Sessions and their results: the one place a run may write.
    - ${RADLOC_SESSIONS_HOST:-/storage/Datasets/ReFeree/radloc_sessions}:/data/sessions
    # `docker compose run` starts a fresh container each time, so the workspace
    # build has to outlive it. Kept off the host to stay out of the repository.
    - radloc-ros-build:/opt/radloc/ros-build
    - radloc-ros-install:/opt/radloc/ros-install
  working_dir: /radloc

services:
  # Interactive shell. radloc-build-core / radloc-build / radloc-validate are
  # defined by the entrypoint.
  radloc:
    <<: *radloc
    container_name: radloc
    stdin_open: true
    tty: true
    command: bash

  # Rebuild the mounted C++ core, then run every check.
  validate:
    <<: *radloc
    container_name: radloc_validate
    command: bash -lc "radloc-build-core && radloc-validate"

  # Multi-session alignment over two prepared sessions. Runs as the invoking
  # user so results do not come back root-owned.
  multi_session:
    <<: *radloc
    container_name: radloc_multi_session
    # UID/GID are readonly in bash, so they are passed under their own names;
    # see docker/README.md.
    user: "${RADLOC_UID:-1000}:${RADLOC_GID:-1000}"
    command: >
      bash -lc "ros2 run radloc_multi_session multi_session_node /radloc/applications/multi-session-slam/config/kaist03_split.yaml"

  # Odometry + pose-graph SLAM over one sequence.
  slam:
    <<: *radloc
    container_name: radloc_slam_run
    user: "${RADLOC_UID:-1000}:${RADLOC_GID:-1000}"
    command: bash -lc "ros2 launch radloc_slam radloc_slam.launch.py sequence_dir:=${SEQUENCE_DIR:-/data/datasets/Mulran/KAIST_03} save_directory:=${SAVE_DIR:-/data/output/KAIST_03/} dataset:=${DATASET:-mulran} > ${SAVE_DIR:-/data/output/KAIST_03/}run.log 2>&1"

  # Rebuild the ROS 2 packages (odometry, SLAM, multi-session) against the mounted sources.
  build:
    <<: *radloc
    container_name: radloc_build
    command: bash -lc "radloc-build-core && radloc-build"

  # The same SLAM on ROS 1 Noetic (self-contained image, sources baked in).
  slam_ros1:
    image: radloc:noetic
    build:
      context: ..
      dockerfile: docker/Dockerfile.ros1
    container_name: radloc_slam_ros1
    network_mode: host
    volumes:
      - ${RADLOC_DATASETS_HOST:-/storage/Datasets/ReFeree}:/data/datasets:ro
      - ${RADLOC_OUTPUT_HOST:-../output}:/data/output
    command: bash -c "roslaunch radloc_ros radloc_slam.launch sequence_dir:=${SEQUENCE_DIR:-/data/datasets/Mulran/KAIST_03} save_directory:=${SAVE_DIR:-/data/output/KAIST_03_ros1/} dataset:=${DATASET:-mulran}"

volumes:
  radloc-ros-build:
  radloc-ros-install:
