name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  library:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: C++ core
        run: |
          if [ "$RUNNER_OS" = macOS ]; then brew install opencv; else sudo apt-get update && sudo apt-get install -y libopencv-dev; fi
          cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release && cmake --build cpp/build -j
          ctest --test-dir cpp/build --output-on-failure
      - run: pip install ".[test]"
      - run: radloc --version && pytest -q python/tests
