[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "radloc"
dynamic = ["version"]
description = "RadLoc: radar global descriptor, place recognition and 3-DoF registration (IROS 2026)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Hogyun Kim", email = "hg.kim@inha.edu" }]
keywords = ["radar", "fmcw radar", "place recognition", "global localization", "loop closure", "slam",
            "multi-session", "multi-robot", "global descriptor", "phase correlation", "mulran", "robotics"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = ["numpy", "scipy", "opencv-python-headless"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
radloc = "radloc.cli:main"

[project.urls]
Homepage = "https://github.com/sparolab/RadLoc"
"Project page" = "https://sparolab.github.io/research/radloc/"
Paper = "https://arxiv.org/abs/2607.08115"
Issues = "https://github.com/sparolab/RadLoc/issues"

[tool.setuptools]
package-dir = { "" = "python" }
packages = ["radloc"]

[tool.setuptools.dynamic]
version = { attr = "radloc.__version__" }
